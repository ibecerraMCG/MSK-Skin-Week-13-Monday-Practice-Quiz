<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 13 Monday Practice Quiz</title>
    <style>
        /* --- Color Variables --- */
        :root {
            /* Default: Dark Theme */
            --bg-color: #2d343e;
            /* Dark background */
            --container-bg: #3c424f;
            /* Slightly lighter container */
            --text-color: #e8e6e3;
            /* Light text */
            --question-text-color: #8ab4f8;
            /* Light blue for questions */
            --lo-text-color: #b0c4de;
            /* Lighter blue for learning objective */
            --border-color: #555;
            /* Darker borders */
            --separator-color: #4a4f5a;
            --label-bg: #454c5a;
            --label-border: #6c757d;
            --label-hover-bg: #525966;
            --label-hover-border: #7a828a;
            --button-bg: #8ab4f8;
            --button-text: #202124;
            --button-hover-bg: #a3c5f9;
            --button-disabled-bg: #5f6368;
            --feedback-correct-bg: #344e41;
            --feedback-correct-text: #c7f9cc;
            --feedback-correct-border: #52b788;
            --feedback-incorrect-bg: #5e2129;
            --feedback-incorrect-text: #f8d7da;
            --feedback-incorrect-border: #a4133c;
            --feedback-rationale-text: #adb5bd;
            /* Lighter gray for rationale */
            --feedback-source-text: #c7d3e0;
            --feedback-separator: #6c757d;
            --radio-accent: #8ab4f8;
        }

        .light-theme {
            --bg-color: #eef2f7;
            --container-bg: #ffffff;
            --text-color: #343a40;
            --question-text-color: #0056b3;
            --lo-text-color: #5a6e8a;
            --border-color: #dee2e6;
            --separator-color: #e9ecef;
            --label-bg: #f8f9fa;
            --label-border: #ced4da;
            --label-hover-bg: #e2e6ea;
            --label-hover-border: #adb5bd;
            --button-bg: #007bff;
            --button-text: white;
            --button-hover-bg: #0056b3;
            --button-disabled-bg: #6c757d;
            --feedback-correct-bg: #d1e7dd;
            --feedback-correct-text: #0f5132;
            --feedback-correct-border: #badbcc;
            --feedback-incorrect-bg: #f8d7da;
            --feedback-incorrect-text: #842029;
            --feedback-incorrect-border: #f5c2c7;
            --feedback-rationale-text: #495057;
            --feedback-source-text: #343a40;
            --feedback-separator: #ccc;
            --radio-accent: #007bff;
        }

        /* --- General Styles --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            line-height: 1.7;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 40px;
            transition: background-color 0.3s, color 0.3s;
        }

        #theme-toggle-button {
            position: fixed;
            top: 15px;
            right: 15px;
            padding: 8px 12px;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: 1px solid var(--label-border);
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            z-index: 1000;
            transition: background-color 0.3s, color 0.3s;
        }

        #theme-toggle-button:hover {
            opacity: 0.8;
        }

        #quiz-container {
            max-width: 900px;
            margin: 80px auto 30px auto;
            background: var(--container-bg);
            padding: 25px 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border-color);
            transition: background-color 0.3s, border-color 0.3s;
        }

        .question-block {
            margin-bottom: 35px;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--separator-color);
            transition: border-color 0.3s;
        }

        .question-block:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 5px;
        }

        .learning-objective {
            font-size: 0.85em;
            font-style: italic;
            color: var(--lo-text-color);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--separator-color);
        }

        .question-text {
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 18px;
            color: var(--question-text-color);
            transition: color 0.3s;
        }

        .options label {
            display: block;
            margin-bottom: 12px;
            cursor: pointer;
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid var(--label-border);
            background-color: var(--label-bg);
            transition: background-color 0.2s ease-in-out, border-color 0.2s ease-in-out;
        }

        .options label:hover {
            background-color: var(--label-hover-bg);
            border-color: var(--label-hover-border);
        }

        .options input[type="radio"]:checked+span {
            font-weight: bold;
            color: var(--question-text-color);
        }

        .options input[type="radio"] {
            margin-right: 12px;
            accent-color: var(--radio-accent);
        }

        .button-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .check-button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.95em;
            transition: background-color 0.2s, color 0.2s, opacity 0.2s;
            background-color: var(--button-bg);
            color: var(--button-text);
        }

        .check-button:hover {
            opacity: 0.85;
        }

        .check-button:disabled {
            background-color: var(--button-disabled-bg);
            cursor: not-allowed;
            opacity: 0.7;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            font-size: 0.95em;
            display: none;
            border: 1px solid transparent;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        .feedback.correct {
            background-color: var(--feedback-correct-bg);
            color: var(--feedback-correct-text);
            border-color: var(--feedback-correct-border);
            display: block;
        }

        .feedback.incorrect {
            background-color: var(--feedback-incorrect-bg);
            color: var(--feedback-incorrect-text);
            border-color: var(--feedback-incorrect-border);
            display: block;
        }

        .feedback-status {
            font-weight: bold;
            font-size: 1.1em;
            display: block;
            margin-bottom: 8px;
        }

        .feedback-rationale {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--feedback-separator);
            font-size: 0.9em;
            color: var(--feedback-rationale-text);
            transition: color 0.3s, border-color 0.3s;
        }

        .feedback-source {
            margin-top: 10px;
            font-size: 0.85em;
            font-style: italic;
            color: var(--feedback-source-text);
            background-color: rgba(0, 0, 0, 0.1);
            padding: 8px;
            border-radius: 4px;
        }

        h1 {
            text-align: center;
            color: var(--question-text-color);
            margin-top: 30px;
            margin-bottom: 30px;
            font-weight: 600;
            transition: color 0.3s;
        }
    </style>
</head>
<body>
    <button id="theme-toggle-button">Toggle Theme</button>
    <h1>Week 13 Monday Practice Quiz</h1>
    <div id="quiz-container">
        <!-- Questions will be loaded here by JavaScript -->
    </div>
    <script>
        const quizData = [
            // Pectoral Region and Axilla Questions
            {
                learningObjective: "LO 1 (Pectoral Region and Axilla): Identify the bones and their major features associated with the pectoral region, including the ribs, sternum, clavicle, scapula, and proximal humerus.",
                question: "A 45-year-old man presents to the emergency department after a direct blow to the chest during a hockey game. On physical examination, a palpable step-off is noted in the midline of his sternum. The physician identifies this landmark and uses it to begin counting the ribs to assess for fractures. This landmark is formed by the articulation of the manubrium and the body of the sternum. Which pair of ribs articulates at this level?",
                options: {
                    A: "1st pair of ribs",
                    B: "2nd pair of ribs",
                    C: "3rd pair of ribs",
                    D: "4th pair of ribs"
                },
                correctAnswer: "B",
                rationale: "The sternal angle (of Louis) is an important clinical landmark located at the junction of the manubrium and the body of the sternum. It is the site of articulation for the 2nd pair of ribs and is used as a starting point for counting ribs.",
                source: "'Sternal angle (of Louis) - Important landmark - Articulates with 2nd ribs' (Pectoral Region and Axilla, Page 9)"
            },
            {
                learningObjective: "LO 1 (Pectoral Region and Axilla): Identify the bones and their major features associated with the pectoral region, including the ribs, sternum, clavicle, scapula, and proximal humerus.",
                question: "A 22-year-old football player is tackled and falls directly onto the point of his shoulder. He reports severe pain and is unable to lift his arm. An X-ray reveals a fracture of the most lateral portion of the scapula that extends anteriorly from the scapular spine. This bony prominence articulates with the clavicle. Which structure has been fractured?",
                options: {
                    A: "Coracoid process",
                    B: "Glenoid fossa",
                    C: "Acromion process",
                    D: "Superior angle of the scapula"
                },
                correctAnswer: "C",
                rationale: "The acromion is the most lateral portion of the scapula, extending anteriorly from the spine. It forms the 'point of the shoulder' and articulates with the clavicle at the acromioclavicular joint.",
                source: "'Acromion – most lateral portion of the scapula that extends anteriorly from the spine of the scapula (G. \"point of the shoulder\")' (Pectoral Region and Axilla, Page 76)"
            },
            {
                learningObjective: "LO 1 (Pectoral Region and Axilla): Identify the bones and their major features associated with the pectoral region, including the ribs, sternum, clavicle, scapula, and proximal humerus.",
                question: "A 30-year-old woman is involved in a motor vehicle collision where her chest strikes the steering wheel. She has pain over the middle of her clavicle. The physician is concerned about potential injury to the neurovascular structures that pass deep to this bone, as it serves to protect them. The clavicle attaches the upper limb to the axial skeleton at which joint?",
                options: {
                    A: "Acromioclavicular joint",
                    B: "Glenohumeral joint",
                    C: "Sternoclavicular joint",
                    D: "Scapulothoracic joint"
                },
                correctAnswer: "C",
                rationale: "The clavicle, or 'collarbone,' is crucial for attaching the upper limb to the axial skeleton. This attachment occurs medially at the sternoclavicular joint. It also protects the underlying neurovascular structures.",
                source: "'Attaches upper limb to axial skeleton at the sternoclavicular joint' (Pectoral Region and Axilla, Page 12)"
            },
            {
                learningObjective: "LO 2 (Pectoral Region and Axilla): Identify and discuss the location and structure of the female breast, including its basic blood supply, innervation, and lymphatic drainage.",
                question: "A 55-year-old woman undergoes a mastectomy for breast cancer. During the procedure, the surgeon carefully dissects the breast tissue off the underlying deep fascia. This creates a plane of separation that allows for some natural movement of the breast. What is the name of this layer of loose connective tissue?",
                options: {
                    A: "Suspensory ligament of Cooper",
                    B: "Retromammary space",
                    C: "Axillary tail of Spence",
                    D: "Lactiferous sinus"
                },
                correctAnswer: "B",
                rationale: "The retromammary space is a layer of loose connective tissue that separates the breast from the deep fascia overlying the pectoral muscles. This space allows for movement and is a key anatomical plane in breast surgery.",
                source: "'Retromammary Space - Layer of connective tissue separating the breast from deep fascia overlying the muscles' (Pectoral Region and Axilla, Page 18)"
            },
            {
                learningObjective: "LO 2 (Pectoral Region and Axilla): Identify and discuss the location and structure of the female breast, including its basic blood supply, innervation, and lymphatic drainage.",
                question: "A 62-year-old woman is diagnosed with breast cancer in the upper outer quadrant of her left breast. A sentinel lymph node biopsy is performed to determine if the cancer has metastasized. The surgeon injects a blue dye near the tumor and identifies the first lymph nodes to receive lymphatic drainage. To which group of lymph nodes does the majority of breast lymph (>75%) drain?",
                options: {
                    A: "Parasternal lymph nodes",
                    B: "Abdominal lymph nodes",
                    C: "Axillary lymph nodes",
                    D: "Supraclavicular lymph nodes"
                },
                correctAnswer: "C",
                rationale: "The lymphatic drainage of the breast is clinically significant for cancer metastasis. More than 75% of the lymph, particularly from the lateral quadrants, drains to the axillary lymph nodes.",
                source: "'Most of the breast (>75%) drains to the axillary lymph nodes' (Pectoral Region and Axilla, Page 23)"
            },
            {
                learningObjective: "LO 2 (Pectoral Region and Axilla): Identify and discuss the location and structure of the female breast, including its basic blood supply, innervation, and lymphatic drainage.",
                question: "During a breast examination on a 48-year-old woman, the physician notes that the nipple is located at the level of the T4 dermatome. Sensation to the skin of the breast, including the nipple, is provided by branches of specific nerves. Which nerves provide sensory innervation to the breast?",
                options: {
                    A: "Supraclavicular nerves",
                    B: "Long thoracic nerve",
                    C: "Medial and lateral pectoral nerves",
                    D: "Anterior and lateral cutaneous branches of the 4th-6th intercostal nerves"
                },
                correctAnswer: "D",
                rationale: "The breast receives sensory and sympathetic innervation from the anterior and lateral cutaneous branches of the 4th through 6th intercostal nerves. The nipple itself is specifically noted to be located at the T4 dermatome.",
                source: "'Anterior and lateral cutaneous branches of 4th - 6th intercostal nerves provide: - Sensory innervation... Nipple is located at the T4 dermatome' (Pectoral Region and Axilla, Page 22)"
            },
            {
                learningObjective: "LO 3 (Pectoral Region and Axilla): Identify the muscles of the pectoral region. Discuss their attachments, innervation, and actions. Describe the clinical implications of nerve damage and their loss of function.",
                question: "A 25-year-old weightlifter presents with pain and weakness in his right shoulder. He reports difficulty performing bench presses. On examination, he has weakness with adduction and medial rotation of the arm. The physician suspects an injury to the largest muscle of the pectoral region. This muscle attaches distally to the lateral lip of the intertubercular groove of the humerus. Which muscle is most likely affected?",
                options: {
                    A: "Pectoralis minor",
                    B: "Serratus anterior",
                    C: "Pectoralis major",
                    D: "Subclavius"
                },
                correctAnswer: "C",
                rationale: "The pectoralis major is a large, fan-shaped muscle that forms the bulk of the anterior axillary fold. Its primary actions are adduction and medial rotation of the arm. Its distal attachment is the lateral lip of the intertubercular groove.",
                source: "'Distal attachment - Lateral lip of intertubercular groove... Actions - Adduction, medial rotation, and flexion of the arm' (Pectoral Region and Axilla, Page 26)"
            },
            {
                learningObjective: "LO 3 (Pectoral Region and Axilla): Identify the muscles of the pectoral region. Discuss their attachments, innervation, and actions. Describe the clinical implications of nerve damage and their loss of function.",
                question: "A 45-year-old woman who underwent a right-sided mastectomy with axillary lymph node dissection 3 months ago presents for follow-up. She complains of weakness in her right shoulder and notes that her right scapula 'sticks out' when she pushes against a wall. This deformity is known as a 'winged scapula.' Damage to which nerve during her surgery would most likely cause this finding?",
                options: {
                    A: "Medial pectoral nerve",
                    B: "Long thoracic nerve",
                    C: "Thoracodorsal nerve",
                    D: "Dorsal scapular nerve"
                },
                correctAnswer: "B",
                rationale: "The long thoracic nerve (from roots C5, C6, C7) innervates the serratus anterior muscle. This muscle protracts the scapula and holds it against the thoracic wall. Paralysis of this muscle results in the medial border of the scapula protruding, a condition known as a winged scapula.",
                source: "'Damage to the Long Thoracic Nerve - Weakens or paralyzes serratus anterior muscle and causes medial border of the scapula to protrude off the back. “Winged scapula”' (Pectoral Region and Axilla, Page 30)"
            },
            {
                learningObjective: "LO 3 (Pectoral Region and Axilla): Identify the muscles of the pectoral region. Discuss their attachments, innervation, and actions. Describe the clinical implications of nerve damage and their loss of function.",
                question: "During a cadaveric dissection, a medical student is tasked with identifying the pectoralis minor muscle. To do so, the student reflects the pectoralis major. They locate a smaller, triangular muscle that attaches superiorly to the coracoid process of the scapula and inferiorly to the 3rd-5th ribs. What is the primary action of this muscle?",
                options: {
                    A: "Adducts and medially rotates the arm",
                    B: "Anchors and depresses the clavicle",
                    C: "Protracts and rotates the scapula upwards",
                    D: "Stabilizes the scapula by drawing it anteroinferiorly"
                },
                correctAnswer: "D",
                rationale: "The pectoralis minor muscle lies deep to the pectoralis major. Its attachments allow it to stabilize the scapula by pulling it forward and downward against the thoracic wall.",
                source: "'Actions - Stabilizes scapula by drawing it anteroinferiorly against thoracic wall' (Pectoral Region and Axilla, Page 27)"
            },
            {
                learningObjective: "LO 4 (Pectoral Region and Axilla): Discuss the contents and boundaries of the axilla.",
                question: "A 28-year-old man sustains a deep laceration to his armpit. In the emergency department, the surgeon explores the wound to assess for damage to the vital structures within this pyramidal space. The surgeon identifies the serratus anterior muscle. This muscle forms which boundary of the axilla?",
                options: {
                    A: "Anterior wall",
                    B: "Posterior wall",
                    C: "Medial wall",
                    D: "Lateral wall"
                },
                correctAnswer: "C",
                rationale: "The axilla is a pyramidal space between the arm and thorax. Its medial wall is formed by the serratus anterior muscle and the upper portion of the thoracic wall (ribs and intercostal muscles).",
                source: "'Boundaries: ... Medially – serratus anterior muscle' (Pectoral Region and Axilla, Page 34)"
            },
            {
                learningObjective: "LO 4 (Pectoral Region and Axilla): Discuss the contents and boundaries of the axilla.",
                question: "A surgical resident is reviewing the anatomy of the axilla before assisting in an axillary lymph node dissection. She notes that the anterior wall of the axilla is composed of two primary muscles, one superficial and one deep. Which pair of muscles forms the anterior wall of the axilla?",
                options: {
                    A: "Serratus anterior and subscapularis",
                    B: "Subscapularis and teres major",
                    C: "Pectoralis major and pectoralis minor",
                    D: "Deltoid and biceps brachii"
                },
                correctAnswer: "C",
                rationale: "The anterior wall of the axilla is formed by the pectoralis major muscle, the pectoralis minor muscle, and the clavipectoral fascia associated with them.",
                source: "'Boundaries: - Anterior – pectoralis minor and major muscles' (Pectoral Region and Axilla, Page 34)"
            },
            {
                learningObjective: "LO 4 (Pectoral Region and Axilla): Discuss the contents and boundaries of the axilla.",
                question: "A 35-year-old woman presents with a painful lump in her axilla. An MRI is ordered to evaluate the contents of the axillary space. In addition to the axillary artery, axillary vein, and lymph nodes, the MRI will show a complex network of nerves that surrounds the axillary artery. What is this network of nerves called?",
                options: {
                    A: "Cervical plexus",
                    B: "Brachial plexus",
                    C: "Intercostal nerves",
                    D: "Lumbar plexus"
                },
                correctAnswer: "B",
                rationale: "The primary contents of the axilla include the axillary artery and its branches, the axillary vein and its tributaries, axillary lymph nodes, and the cords and branches of the brachial plexus, all embedded in axillary fat.",
                source: "'Contents: - Axillary artery - Axillary vein - Brachial plexus' (Pectoral Region and Axilla, Page 34)"
            },
            {
                learningObjective: "LO 5 (Pectoral Region and Axilla): Identify the axillary artery and vein. Trace the course of the major branches arising from the axillary artery and describe their course/distribution.",
                question: "A vascular surgeon is performing a bypass procedure in the upper arm. The surgeon needs to clamp the axillary artery. To properly identify its boundaries, the surgeon recalls that the axillary artery is a continuation of the subclavian artery. At what landmark does the name change from subclavian artery to axillary artery?",
                options: {
                    A: "Inferior border of the teres major muscle",
                    B: "Lateral border of the first rib",
                    C: "Medial border of the pectoralis minor muscle",
                    D: "Coracoid process of the scapula"
                },
                correctAnswer: "B",
                rationale: "The axillary artery begins at the lateral border of the 1st rib, where it is the direct continuation of the subclavian artery. It ends at the inferior border of the teres major muscle, where it becomes the brachial artery.",
                source: "'Continuation of the subclavian a. - Name changes at the lateral border of the 1st rib' (Pectoral Region and Axilla, Page 36)"
            },
            {
                learningObjective: "LO 5 (Pectoral Region and Axilla): Identify the axillary artery and vein. Trace the course of the major branches arising from the axillary artery and describe their course/distribution.",
                question: "During an axillary dissection, a surgeon must be careful to preserve the branches of the axillary artery. The surgeon identifies the thoracoacromial trunk, which arises from the second part of the axillary artery, deep to the pectoralis minor. This trunk gives off four named branches. Which of the following is a branch of the thoracoacromial trunk?",
                options: {
                    A: "Superior thoracic artery",
                    B: "Lateral thoracic artery",
                    C: "Pectoral branch",
                    D: "Subscapular artery"
                },
                correctAnswer: "C",
                rationale: "The second part of the axillary artery lies deep to the pectoralis minor and gives off two branches: the thoracoacromial trunk and the lateral thoracic artery. The thoracoacromial trunk further divides into four branches: clavicular, acromial, deltoid, and pectoral.",
                source: "'Branches: - Thoracoacromial trunk (artery)... > Pectoral branch' (Pectoral Region and Axilla, Page 38)"
            },
            {
                learningObjective: "LO 5 (Pectoral Region and Axilla): Identify the axillary artery and vein. Trace the course of the major branches arising from the axillary artery and describe their course/distribution.",
                question: "A 29-year-old man suffers a posterior dislocation of his shoulder. Following reduction, the physician is concerned about a possible injury to the artery that passes through the quadrangular space along with the axillary nerve. This artery is a branch of the third part of the axillary artery. Which artery is most at risk?",
                options: {
                    A: "Anterior humeral circumflex artery",
                    B: "Posterior humeral circumflex artery",
                    C: "Thoracodorsal artery",
                    D: "Circumflex scapular artery"
                },
                correctAnswer: "B",
                rationale: "The third part of the axillary artery gives rise to the subscapular artery, the anterior humeral circumflex artery, and the posterior humeral circumflex artery. The posterior humeral circumflex artery passes through the quadrangular space with the axillary nerve and is at risk of injury with posterior shoulder dislocations.",
                source: "'Posterior humeral circumflex artery – passes medially through the posterior wall of the axilla via the quadrangular space with the axillary nerve' (Pectoral Region and Axilla, Page 82)"
            },
            {
                learningObjective: "LO 6 (Pectoral Region and Axilla): Identify and discuss the venous drainage patterns of the axillary and cephalic veins.",
                question: "A phlebotomist is attempting to draw blood from a patient's arm. He identifies a prominent superficial vein running in the groove between the deltoid and pectoralis major muscles. This vein ultimately pierces the deep fascia to empty into the axillary vein near the clavicle. Which vein is being described?",

                    A: "Basilic vein",
                    B: "Brachial vein",
                    C: "Cephalic vein",
                    D: "Axillary vein"

                correctAnswer: "C",
                rationale: "The cephalic vein is a superficial vein of the upper limb that runs in the deltopectoral groove between the deltoid and pectoralis major muscles. It empties into the axillary vein just inferior to the clavicle.",
                source: "'Runs in the deltopectoral groove - Between the deltoid and pectoralis major muscles. Empties into the axillary vein near the clavicle' (Pectoral Region and Axilla, Page 43)"
            },
            {
                learningObjective: "LO 6 (Pectoral Region and Axilla): Identify and discuss the venous drainage patterns of the axillary and cephalic veins.",
                question: "During surgery in the axilla, the surgeon identifies the axillary vein. The surgeon notes that this large vein is formed by the union of two other veins at the inferior border of the teres major muscle. Which two veins unite to form the axillary vein?",
                options: {
                    A: "Cephalic and subclavian veins",
                    B: "Brachial and basilic veins",
                    C: "Internal and external jugular veins",
                    D: "Cephalic and basilic veins"
                },
                correctAnswer: "B",
                rationale: "The axillary vein is formed by the convergence of the brachial vein (a deep vein) and the basilic vein (a superficial vein) at the inferior border of the teres major. It then continues superiorly to become the subclavian vein.",
                source: "'Formed by the union of brachial and basilic veins in the arm' (Pectoral Region and Axilla, Page 41)"
            },
            {
                learningObjective: "LO 6 (Pectoral Region and Axilla): Identify and discuss the venous drainage patterns of the axillary and cephalic veins.",
                question: "An anesthesiologist is placing a central venous catheter via the subclavian approach. He knows that medial to the first rib, the axillary vein becomes the subclavian vein. The axillary vein is typically located in what position relative to the axillary artery?",
                options: {
                    A: "Anterior",
                    B: "Posterior",
                    C: "Medial",
                    D: "Lateral"
                },
                correctAnswer: "A",
                rationale: "Within the axillary sheath, the axillary vein is located anterior to the axillary artery. This relationship is important for surgical and procedural orientation in the axilla.",
                source: "'Located anterior to the axillary artery' (Pectoral Region and Axilla, Page 41)"
            },

        const quizContainer = document.getElementById('quiz-container');
        const themeToggleButton = document.getElementById('theme-toggle-button');
        const bodyElement = document.body;

        function applyTheme(theme) {
            if (theme === 'light') {
                bodyElement.classList.add('light-theme');
                themeToggleButton.textContent = 'Switch to Dark Mode';
            } else {
                bodyElement.classList.remove('light-theme');
                themeToggleButton.textContent = 'Switch to Light Mode';
            }
            localStorage.setItem('quizTheme', theme);
        }

        function loadQuiz() {
            quizData.forEach((qData, index) => {
                const questionBlock = document.createElement('div');
                questionBlock.classList.add('question-block');
                questionBlock.id = `q${index}`;

                const loText = document.createElement('div');
                loText.classList.add('learning-objective');
                loText.textContent = qData.learningObjective;
                questionBlock.appendChild(loText);

                const questionText = document.createElement('p');
                questionText.classList.add('question-text');
                questionText.innerHTML = `${index + 1}. ${qData.question}`;
                questionBlock.appendChild(questionText);

                const optionsDiv = document.createElement('div');
                optionsDiv.classList.add('options');
                for (const optionKey in qData.options) {
                    const optionId = `q${index}_${optionKey}`;
                    const label = document.createElement('label');
                    label.htmlFor = optionId;

                    const radioInput = document.createElement('input');
                    radioInput.type = 'radio';
                    radioInput.name = `q${index}`;
                    radioInput.value = optionKey;
                    radioInput.id = optionId;

                    const labelText = document.createElement('span');
                    labelText.textContent = ` ${optionKey}. ${qData.options[optionKey]}`;

                    label.appendChild(radioInput);
                    label.appendChild(labelText);
                    optionsDiv.appendChild(label);
                }
                questionBlock.appendChild(optionsDiv);

                const buttonContainer = document.createElement('div');
                buttonContainer.classList.add('button-container');

                const checkButton = document.createElement('button');
                checkButton.textContent = 'Check Answer';
                checkButton.classList.add('check-button');
                checkButton.onclick = () => checkAnswer(index);
                buttonContainer.appendChild(checkButton);
                questionBlock.appendChild(buttonContainer);

                const feedbackDiv = document.createElement('div');
                feedbackDiv.classList.add('feedback');
                questionBlock.appendChild(feedbackDiv);

                quizContainer.appendChild(questionBlock);
            });
        }

        function checkAnswer(questionIndex) {
            const questionBlockElement = document.getElementById(`q${questionIndex}`);
            const selectedRadioButton = questionBlockElement.querySelector('input[type="radio"]:checked');
            if (!selectedRadioButton) {
                alert("Please select an answer first.");
                return;
            }
            const selectedOptionKey = selectedRadioButton.value;
            const qData = quizData[questionIndex];
            const feedbackDiv = questionBlockElement.querySelector('.feedback');
            const correct = selectedOptionKey === qData.correctAnswer;

            let feedbackHTML = '';
            if (correct) {
                feedbackHTML = `<span class="feedback-status">Correct!</span>`;
                feedbackDiv.className = 'feedback correct';
            } else {
                feedbackHTML = `<span class="feedback-status">Incorrect. The correct answer is ${qData.correctAnswer}.</span>`;
                feedbackDiv.className = 'feedback incorrect';
            }

            feedbackHTML += `<div class="feedback-rationale"><strong>Rationale:</strong> ${qData.rationale}</div>`;
            feedbackHTML += `<div class="feedback-source"><strong>Source:</strong> ${qData.source}</div>`;

            feedbackDiv.innerHTML = feedbackHTML;
        }

        themeToggleButton.addEventListener('click', () => {
            if (bodyElement.classList.contains('light-theme')) {
                applyTheme('dark');
            } else {
                applyTheme('light');
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('quizTheme') || 'dark';
            applyTheme(savedTheme);
            loadQuiz();
        });
    </script>
